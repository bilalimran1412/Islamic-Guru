services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: guru
      POSTGRES_DB: guru
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://guru:guru@db:5432/guru
    ports: ["8000:8000"]
    depends_on: [db]

volumes:
  pgdata:
