name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guru
          POSTGRES_PASSWORD: guru
          POSTGRES_DB: guru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guru" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://guru:guru@localhost:5432/guru
        run: alembic upgrade head && alembic check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
